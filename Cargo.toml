[package]
name = "rustorrent"
version = "0.2.0-rc.6"
edition = "2021"
rust-version = "1.89"
authors = ["Josu San Martin"]
description = "A compact BitTorrent client with a built-in web interface"
license = "MIT AND BSD-3-Clause"
repository = "https://github.com/josusanmartin/rustorrent"
homepage = "https://github.com/josusanmartin/rustorrent"
readme = "README.md"
keywords = ["bittorrent", "torrent", "magnet", "p2p"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
native-tls = "0.2"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["full"]
core = []
full = [
    "udp_tracker",
    "dht",
    "lpd",
    "utp",
    "mse",
    "natpmp",
    "upnp",
    "webseed",
]
udp_tracker = []
dht = []
lpd = []
utp = []
mse = []
natpmp = []
upnp = []
webseed = []
verbose = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Aborting on panic removes the unwinding machinery (~290 KB). Untrusted input
# must therefore never reach a panic; parsers are fuzzed and bounds-checked.
panic = "abort"
overflow-checks = true
strip = "symbols"
